name: Telegram news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest channel posts
        run: python3 tg_news.py
      - name: Commit news.json if changed
        run: |
          git config user.name "phoinexes-news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          
          git diff --cached --quiet || (git commit -m "Update news.json" && git push)
