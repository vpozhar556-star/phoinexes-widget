 box-shadow:inset 0 0 0 1px #FD4B03;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}

<script>
(function(){
  var bgv=document.getElementById('bgv'), cn=navigator.connection||{};
  if(cn.saveData||/(^|-)2g/.test(cn.effectiveType||'')){ bgv.remove(); } else { bgv.addEventListener('playing',function(){bgv.classList.add('on');}); if(!bgv.paused&&bgv.readyState>2) bgv.classList.add('on'); }
  var hero=document.getElementById('hero'), h1=document.getElementById('h1'), copy=document.getElementById('copy');
  var cv=document.getElementById('fx'), x=cv.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2), W,H, P=[], embers=[], state='idle', t0=0, busy=false;
  function size(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
  function ash(){ return {x:W*(0.62+Math.random()*0.22), y:H*(0.78+Math.random()*0.1)}; }  // ash pile on the right
  function sample(){
    var hr=hero.getBoundingClientRect(), pts=[], off=document.createElement('canvas'), o=off.getContext('2d');
    off.width=W; off.height=H;
    [].forEach.call(h1.querySelectorAll('span'),function(s){
      var cs=getComputedStyle(s), tn=s.firstChild, txt=tn.textContent, re=/\S+/g, m;
      o.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily; o.textBaseline='alphabetic'; o.fillStyle='#fff';
      if(o.letterSpacing!==undefined) o.letterSpacing=cs.letterSpacing;
      while((m=re.exec(txt))){ var rg=document.createRange(); rg.setStart(tn,m.index); rg.setEnd(tn,m.index+m[0].length);
        var r=rg.getBoundingClientRect(), mm=o.measureText(m[0]);
        var asc=mm.actualBoundingBoxAscent||parseFloat(cs.fontSize)*0.8, desc=mm.actualBoundingBoxDescent||0;
        o.fillText(m[0], r.left-hr.left, r.top-hr.top+(r.height+asc-desc)/2); }
    });
    var d=o.getImageData(0,0,W,H).data, step=W<900?2:3;
    for(var yy=0;yy<H;yy+=step)for(var xx=0;xx<W;xx+=step){ if(d[(yy*W+xx)*4+3]>130) pts.push({tx:xx,ty:yy}); }
    return pts;
  }
  function build(fromAsh){
    var pts=sample(); var minX=1e9,maxX=-1e9; pts.forEach(function(p){minX=Math.min(minX,p.tx);maxX=Math.max(maxX,p.tx);});
    P=pts.map(function(p){var a=ash(); return {tx:p.tx,ty:p.ty,sx:fromAsh?a.x:p.tx,sy:fromAsh?a.y:p.ty,x:fromAsh?a.x:p.tx,y:fromAsh?a.y:p.ty,
      d:(p.tx-minX)/(maxX-minX+1)*1.1+Math.random()*0.5, cx:(Math.random()-0.5)*260, cy:-120-Math.random()*220, s:1+Math.random()*1.2};});
  }
  function lerp(a,b,t){return a+(b-a)*t}
  function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3)}
  function col(k,al){ // k: 0 ash grey -> .6 orange -> 1 white hot
    var r,g,b; if(k<0.6){var u=k/0.6;r=lerp(110,253,u);g=lerp(105,75,u);b=lerp(100,3,u);} else {var u=(k-0.6)/0.4;r=lerp(253,255,u);g=lerp(75,225,u);b=lerp(3,190,u);}
    return 'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+al+')';
  }
  // ---- phases ----
  function assemble(from){ // particles fly from current/ash positions into letters and ignite
    state='assemble'; t0=performance.now(); busy=true;
    P.forEach(function(p){ if(from==='scatter'){p.sx=p.x;p.sy=p.y;} });
  }
  function scatter(){ // letters burn into ash and drift away
    if(busy) return; h1.classList.remove('glow'); h1.classList.remove('lit');
    build(false); state='scatter'; t0=performance.now(); busy=true;
  }
  function frame(now){
    x.clearRect(0,0,W,H);
    var T=(now-t0)/1000;
    if(state==='assemble'){
      var dur=5.2, done=true;
      x.globalCompositeOperation='lighter';
      for(var i=0;i<P.length;i++){var p=P[i], k=ease((T-p.d)/(dur-1.6));
        if(k<1) done=false;
        // curved flight through a control point
        var mx=lerp(p.sx,p.tx,0.5)+p.cx, my=lerp(p.sy,p.ty,0.5)+p.cy;
        var a=(1-k)*(1-k), b=2*(1-k)*k, c=k*k;
        p.x=a*p.sx+b*mx+c*p.tx; p.y=a*p.sy+b*my+c*p.ty;
        var heat=k<0.75?k*0.75:0.56+(k-0.75)*1.76;
        x.fillStyle=col(Math.min(1,heat), k<=0?0:(0.35+0.65*k)); x.fillRect(p.x,p.y,p.s,p.s);
      }
      x.globalCompositeOperation='source-over';
      if(done || T>dur+1){ state='ignite'; t0=now; h1.classList.add('lit','glow'); hero.classList.add('ready'); setTimeout(function(){h1.classList.remove('glow');},1600); }
    } else if(state==='ignite'){
      var al=Math.max(0,1-T/1.6); x.globalCompositeOperation='lighter';
      for(var i=0;i<P.length;i++){var p=P[i]; x.fillStyle=col(1,al); x.fillRect(p.tx,p.ty,p.s,p.s);}
      x.globalCompositeOperation='source-over';
      if(al<=0){state='idle';busy=false;}
    } else if(state==='scatter'){
      var dur=2.4; x.globalCompositeOperation='lighter';
      for(var i=0;i<P.length;i++){var p=P[i], k=ease((T-p.d*0.6)/dur);
        p.x=p.tx+k*(80+p.cx*0.7+(p.ty%7)*14); p.y=p.ty+k*(p.cy*0.8)+Math.sin(T*2+i)*k*4;
        var heat=1-k; x.fillStyle=col(Math.max(0,heat), 0.95-0.35*k); x.fillRect(p.x,p.y,p.s,p.s);}
      x.globalCompositeOperation='source-over';
      if(T>dur+0.9){ assemble('scatter'); }
    }
    // rising embers from the ash pile
    if(Math.random()<0.35) embers.push({x:W*(0.6+Math.random()*0.3),y:H*0.85,vx:(Math.random()-0.5)*0.4,vy:-0.3-Math.random()*0.6,l:1});
    x.globalCompositeOperation='lighter';
    for(var j=embers.length-1;j>=0;j--){var e=embers[j]; e.x+=e.vx+Math.sin(now/500+j)*0.3; e.y+=e.vy; e.l-=0.0035;
      if(e.l<=0){embers.splice(j,1);continue;} x.fillStyle='rgba(255,140,50,'+(e.l*0.8)+')'; x.fillRect(e.x,e.y,1.6,1.6);}
    x.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }
  function start(){ size(); build(true); assemble('ash'); requestAnimationFrame(frame); }
  h1.addEventListener('mouseenter',scatter);
  h1.addEventListener('touchstart',scatter,{passive:true});
  window.addEventListener('resize',function(){size(); if(!busy){build(false);} });
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(start,300);});
})();
</script></body></html>
